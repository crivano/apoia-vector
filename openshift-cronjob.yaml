kind: CronJob
apiVersion: batch/v1
metadata:
  name: sync-start
  namespace: apoia-vector-tst
spec:
  schedule: 15 2 * * *
  startingDeadlineSeconds: 3000
  concurrencyPolicy: Forbid
  suspend: false
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: apoia-vector
            component: sync-cron
        spec:
          containers:
            - name: sync-trigger
              image: 'registry.access.redhat.com/ubi9/ubi-minimal:latest'
              command:
                - /bin/bash
                - '-c'
                - |
                  echo "Starting sync at $(date)"
                  
                  # Instalar curl se não estiver disponível
                  if ! command -v curl &> /dev/null; then
                    echo "Installing curl..."
                    microdnf install -y curl
                    microdnf clean all
                  fi

                  # Chamar o endpoint de sync-start
                  RESPONSE=$(curl -w "\n%{http_code}" -s \
                    -H "Authorization: Bearer ${CRON_SECRET}" \
                    "${APP_URL}/api/v1/cron/sync-start")

                  HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
                  BODY=$(echo "$RESPONSE" | sed '$d')

                  echo "Response: $BODY"
                  echo "HTTP Status: $HTTP_CODE"

                  # Verificar se foi bem-sucedido (200-299)
                  if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                    echo "Sync started successfully"
                    exit 0
                  else
                    echo "Failed to start sync"
                    exit 1
                  fi
              env:
                - name: APP_URL
                  value: 'http://apoia-vector:8080'
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: apoia-vector-tst-envs
                      key: CRON_SECRET
              resources:
                limits:
                  cpu: 50m
                  memory: 64Mi
                requests:
                  cpu: 10m
                  memory: 32Mi
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              imagePullPolicy: Always
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          dnsPolicy: ClusterFirst
          securityContext: {}
          schedulerName: default-scheduler
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
